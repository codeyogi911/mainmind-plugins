interface:
  display_name: "Continue in another app"
  short_description: "Move your agent between AI apps"
  default_prompt: "Continue with my agent in another app."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
